[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-pl-speech-translation"
version = "0.3.0"
description = "Streamlit app and benchmark pipeline for Russian ASR with Polish translation support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "numpy",
    "soundfile",
    "librosa",
    "matplotlib",
    "plotly",
    "unidecode",
]

[project.scripts]
asr-benchmark = "benchmarking.cli:main"

[project.optional-dependencies]
asr = [
    "openai-whisper",
    "transformers",
    "torch",
    "sentencepiece",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I"]
