[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-pl-speech-translation"
version = "0.2.0"
description = "ASR course project: RU speech to PL translation comparison."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "jiwer>=3.0",
  "sacrebleu>=2.4",
]

[project.scripts]
ru-pl-st = "ru_pl_st.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
